<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">Mobile, kiosk, and public tracker use cases</title>
  <desc id="desc">Mobile users submit and view logbook records; submitters can look up status through a QR link or phone number.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#173b2d}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#536b60}.head{font-size:19px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#536b60}.actor{font-size:17px;font-weight:700}.line{fill:none;stroke:#526c5e;stroke-width:2}.use{fill:#fff;stroke:#4c8b65;stroke-width:1.7}
    </style>
  </defs>
  <rect width="1300" height="820" fill="#f3f8f4"/>
  <text x="42" y="52" class="title">Mobile, Kiosk, and Public Tracker Use Cases</text>
  <text x="42" y="80" class="sub">Kiosk operations depend on the server access setting. Public tracking is read-only.</text>

  <rect x="28" y="248" width="190" height="78" rx="18" fill="#e1f1e6" stroke="#1b6a45" stroke-width="2"/>
  <text x="123" y="280" text-anchor="middle" class="actor">Mobile / Kiosk</text>
  <text x="123" y="304" text-anchor="middle" class="small">User</text>
  <rect x="28" y="584" width="190" height="78" rx="18" fill="#e8eef9" stroke="#5879a7" stroke-width="2"/>
  <text x="123" y="616" text-anchor="middle" class="actor">Submitter / Client</text>
  <text x="123" y="640" text-anchor="middle" class="small">No portal account</text>

  <rect x="250" y="120" width="1010" height="390" rx="24" fill="#eaf4ed" stroke="#397851" stroke-width="2"/>
  <text x="280" y="157" class="head">Mobile Logbook (React client → PHP API)</text>
  <path d="M218 287 H270 M218 623 H235 V670 H270" class="line"/>
  <rect x="285" y="190" width="285" height="58" rx="25" class="use"/><text x="427" y="225" text-anchor="middle" class="label">View agenda and record queues</text>
  <rect x="605" y="190" width="285" height="58" rx="25" class="use"/><text x="747" y="225" text-anchor="middle" class="label">Submit standard / quick document</text>
  <rect x="925" y="190" width="285" height="58" rx="25" class="use"/><text x="1067" y="225" text-anchor="middle" class="label">Register / edit bulk submission</text>
  <rect x="285" y="280" width="285" height="58" rx="25" class="use"/><text x="427" y="315" text-anchor="middle" class="label">Advance eligible status</text>
  <rect x="605" y="280" width="285" height="58" rx="25" class="use"/><text x="747" y="315" text-anchor="middle" class="label">Record / return borrowed item</text>
  <rect x="925" y="280" width="285" height="58" rx="25" class="use"/><text x="1067" y="315" text-anchor="middle" class="label">Generate date-range report</text>
  <rect x="285" y="370" width="285" height="58" rx="25" class="use"/><text x="427" y="405" text-anchor="middle" class="label">Look up records by phone</text>
  <rect x="605" y="370" width="285" height="58" rx="25" class="use"/><text x="747" y="405" text-anchor="middle" class="label">Notify client for released item</text>
  <rect x="925" y="370" width="285" height="58" rx="25" class="use"/><text x="1067" y="405" text-anchor="middle" class="label">Scan CEIT tracking QR</text>
  <text x="285" y="470" class="small">Standard submission requires an 11-digit phone number; Quick Submit makes it optional.</text>
  <text x="285" y="490" class="small">When kiosk access is enabled, reachable users can use these API operations without portal sign-in.</text>

  <rect x="250" y="550" width="1010" height="220" rx="24" fill="#e9eef8" stroke="#5879a7" stroke-width="2"/>
  <text x="280" y="587" class="head">Public Tracking (opaque QR token; read-only)</text>
  <rect x="315" y="625" width="350" height="64" rx="25" class="use"/><text x="490" y="652" text-anchor="middle" class="label">Check document status and history</text><text x="490" y="675" text-anchor="middle" class="small">Reference, status timeline, public notes</text>
  <rect x="765" y="625" width="350" height="64" rx="25" class="use"/><text x="940" y="652" text-anchor="middle" class="label">Check bulk receipt and status</text><text x="940" y="675" text-anchor="middle" class="small">Batch summary; no individual paper details</text>
  <path d="M218 623 H290 V657 H300 M218 623 H740 V657 H750" class="line"/>
  <text x="280" y="735" class="small">Invalid token, disabled tracking, or unknown record returns no protected record details.</text>
</svg>

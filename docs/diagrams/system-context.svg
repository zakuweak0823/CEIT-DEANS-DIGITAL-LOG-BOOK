<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1240" role="img" aria-labelledby="title desc">
  <title id="title">Digital Logbook data-flow diagrams, Level 0 and Level 1</title>
  <desc id="desc">Level 0 shows users, the digital logbook system, its database, and SMS gateway. Level 1 decomposes the system into intake, workflow processing, tracking and reports, and notifications.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#222}.section{fill:#63798b;stroke:#506476;stroke-width:2}.section-label{font-size:18px;font-weight:700;fill:#101820}.heading{font-size:25px;font-weight:700}.subheading{font-size:15px;fill:#52606b}.entity{fill:#dce9f8;stroke:#8daed2;stroke-width:2}.process{fill:#f4f4f4;stroke:#a5a5a5;stroke-width:2}.store{fill:#ffe7c9;stroke:#e5ad39;stroke-width:2}.service{fill:#e9ddf1;stroke:#b59ac8;stroke-width:2}.label{font-size:13px;font-weight:600}.small{font-size:12px;fill:#3f4b54}.flow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.flowback{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
  </defs>
  <rect width="1500" height="1240" fill="#fff"/>

  <rect x="70" y="28" width="195" height="68" rx="10" class="section"/>
  <text x="167" y="70" text-anchor="middle" class="section-label">LEVEL 0</text>
  <text x="750" y="62" text-anchor="middle" class="heading">Digital Logbook System — Context Diagram</text>
  <text x="750" y="89" text-anchor="middle" class="subheading">The system boundary and its external users, data store, and service integrations</text>

  <rect x="75" y="172" width="215" height="94" rx="14" class="entity"/>
  <text x="182" y="210" text-anchor="middle" class="label">Office Staff</text>
  <text x="182" y="234" text-anchor="middle" class="small">(Portal / Mobile App)</text>
  <rect x="640" y="165" width="300" height="118" rx="18" class="process"/>
  <text x="790" y="210" text-anchor="middle" class="label">0</text>
  <text x="790" y="238" text-anchor="middle" class="heading">Digital Logbook</text>
  <text x="790" y="260" text-anchor="middle" class="label">System</text>
  <rect x="1200" y="172" width="225" height="94" rx="14" class="service"/>
  <text x="1312" y="210" text-anchor="middle" class="label">SMS Gateway</text>
  <text x="1312" y="234" text-anchor="middle" class="small">(External Provider)</text>

  <path d="M290 195 H630" class="flow"/>
  <text x="460" y="182" text-anchor="middle" class="small">Document, batch, and loan data</text>
  <path d="M630 250 H290" class="flow"/>
  <text x="460" y="271" text-anchor="middle" class="small">Confirmation, status, and reports</text>
  <path d="M940 195 H1190" class="flow"/>
  <text x="1065" y="182" text-anchor="middle" class="small">Recipient and message</text>
  <path d="M1190 250 H940" class="flow"/>
  <text x="1065" y="271" text-anchor="middle" class="small">Delivery status</text>

  <rect x="640" y="355" width="300" height="82" rx="14" class="store"/>
  <text x="790" y="389" text-anchor="middle" class="label">D1 — Application Database</text>
  <text x="790" y="413" text-anchor="middle" class="small">Records, users, settings, and history</text>
  <path d="M730 283 V345" class="flow"/>
  <text x="650" y="322" text-anchor="end" class="small">Store / update data</text>
  <path d="M850 345 V283" class="flow"/>
  <text x="865" y="322" class="small">Retrieve data</text>

  <text x="750" y="481" text-anchor="middle" class="subheading">Level 0 treats the logbook as one process; the next diagram decomposes its main functions.</text>
  <path d="M55 510 H1445" stroke="#d7dde2" stroke-width="2"/>

  <rect x="70" y="535" width="195" height="68" rx="10" class="section"/>
  <text x="167" y="577" text-anchor="middle" class="section-label">LEVEL 1</text>
  <text x="750" y="568" text-anchor="middle" class="heading">Digital Logbook System — Functional Decomposition</text>
  <text x="750" y="594" text-anchor="middle" class="subheading">Processes exchange records with the shared application database and external services</text>

  <rect x="45" y="690" width="190" height="86" rx="14" class="entity"/>
  <text x="140" y="726" text-anchor="middle" class="label">Office Staff</text>
  <text x="140" y="750" text-anchor="middle" class="small">(Authorized User)</text>
  <rect x="45" y="900" width="190" height="86" rx="14" class="entity"/>
  <text x="140" y="936" text-anchor="middle" class="label">Submitter / Client</text>
  <text x="140" y="960" text-anchor="middle" class="small">(Public Tracker)</text>

  <rect x="320" y="685" width="190" height="100" rx="16" class="process"/>
  <text x="415" y="722" text-anchor="middle" class="label">1.0</text>
  <text x="415" y="750" text-anchor="middle" class="label">Intake and</text>
  <text x="415" y="770" text-anchor="middle" class="label">Submission</text>
  <rect x="585" y="685" width="210" height="100" rx="16" class="process"/>
  <text x="690" y="722" text-anchor="middle" class="label">2.0</text>
  <text x="690" y="750" text-anchor="middle" class="label">Workflow and</text>
  <text x="690" y="770" text-anchor="middle" class="label">Record Processing</text>
  <rect x="875" y="685" width="210" height="100" rx="16" class="process"/>
  <text x="980" y="722" text-anchor="middle" class="label">3.0</text>
  <text x="980" y="750" text-anchor="middle" class="label">Tracking and</text>
  <text x="980" y="770" text-anchor="middle" class="label">Reports</text>
  <rect x="1125" y="685" width="180" height="100" rx="16" class="process"/>
  <text x="1215" y="722" text-anchor="middle" class="label">4.0</text>
  <text x="1215" y="750" text-anchor="middle" class="label">Notification</text>
  <text x="1215" y="770" text-anchor="middle" class="label">Processing</text>
  <rect x="1360" y="690" width="125" height="86" rx="14" class="service"/>
  <text x="1422" y="726" text-anchor="middle" class="label">SMS</text>
  <text x="1422" y="750" text-anchor="middle" class="small">Gateway</text>

  <path d="M235 715 H310" class="flow"/>
  <text x="270" y="704" text-anchor="middle" class="small">Records / request</text>
  <path d="M310 758 H235" class="flow"/>
  <text x="270" y="779" text-anchor="middle" class="small">Confirmation</text>
  <path d="M510 735 H575" class="flow"/>
  <text x="542" y="722" text-anchor="middle" class="small">Validated data</text>
  <path d="M795 735 H865" class="flow"/>
  <text x="830" y="722" text-anchor="middle" class="small">Status / report data</text>
  <path d="M1085 715 H1150" class="flow"/>
  <text x="1117" y="704" text-anchor="middle" class="small">Alert event</text>
  <path d="M1305 715 H1350" class="flow"/>
  <text x="1327" y="704" text-anchor="middle" class="small">SMS</text>
  <path d="M1350 758 H1305" class="flow"/>
  <text x="1327" y="780" text-anchor="middle" class="small">Status</text>

  <rect x="570" y="865" width="315" height="82" rx="14" class="store"/>
  <text x="727" y="900" text-anchor="middle" class="label">D1 — Application Database</text>
  <text x="727" y="924" text-anchor="middle" class="small">Documents, batches, loans, users, settings, logs</text>
  <path d="M430 785 V825 H620 V855" class="flow"/>
  <text x="475" y="817" class="small">Store submissions</text>
  <path d="M690 795 V855" class="flow"/>
  <text x="702" y="830" class="small">Read / update</text>
  <path d="M980 795 V835 H855 V855" class="flow"/>
  <text x="900" y="824" class="small">Read tracking data</text>
  <path d="M1215 795 V845 H885" class="flow"/>
  <text x="1070" y="837" class="small">Save notification log / status</text>

  <path d="M960 685 V620 H265 V680 H235" class="flow"/>
  <text x="600" y="611" text-anchor="middle" class="small">Reports / status lists</text>
  <path d="M235 925 H270 V650 H1000 V675" class="flow"/>
  <text x="620" y="666" text-anchor="middle" class="small">QR / phone lookup request</text>
  <path d="M1035 785 V1010 H260 V970 H235" class="flow"/>
  <text x="450" y="956" class="small">Public status and tracking history</text>

  <text x="45" y="1040" class="small">SMS delivery is optional and depends on server-side provider configuration. Public tracking only returns limited, read-only status information.</text>
  <text x="45" y="1065" class="small">Admin-only account, audit-log, and backup functions are performed through the authorized web portal and are included in Process 2.0 / 3.0.</text>
</svg>
